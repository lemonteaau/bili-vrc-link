name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Check, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Package Chrome extension
        run: pnpm run zip

      - name: Package Firefox extension
        run: pnpm run zip:firefox

      - name: Save Chrome package
        uses: actions/upload-artifact@v7
        with:
          name: bili-vrc-link-chrome-${{ github.sha }}
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Save Firefox package
        uses: actions/upload-artifact@v7
        with:
          name: bili-vrc-link-firefox-${{ github.sha }}
          path: .output/*-firefox.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
