<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bili → VRC · 解析结果</title>
  </head>
  <body>
    <main class="result">
      <header class="top">
        <div class="brand"><img src="/icon/48.png" alt="" />Bili → VRC</div>
        <button id="settings" class="quiet small-button">设置</button>
      </header>
      <h1 id="title">解析结果</h1>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <textarea id="url" aria-label="播放链接" readonly hidden></textarea>
      <div class="row spacer">
        <button id="copy" class="primary" hidden>复制播放链接</button
        ><button id="open" hidden>打开解析网页</button>
      </div>
      <details id="log" class="spacer" hidden>
        <summary>尝试过程</summary>
        <ol id="attempts" class="attempts"></ol>
      </details>
      <hr class="divider" />
      <label for="source">换一种方式再试</label>
      <div class="row">
        <select id="source" class="grow"></select
        ><button id="retry">重新解析</button>
      </div>
      <p id="input" class="small"></p>
      <p class="hint">
        把链接粘贴到 VRChat
        世界里视频播放器的地址栏。如果提示网址不受信任：公开房间（Public）通常无法播放；好友房或私人房间可以在
        VRChat 设置里开启「Allow Untrusted URLs」。
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
